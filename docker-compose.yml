services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    network_mode: bridge
    environment:
      POSTGRES_USER: mapcar
      POSTGRES_PASSWORD: mapcar
      POSTGRES_DB: mapcar
    ports:
      - "5433:5432"
    volumes:
      - mapcar-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapcar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mapcar-pg:
