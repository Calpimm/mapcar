name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mapcar:mapcar@localhost:5433/mapcar
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mapcar/db generate
      - name: Lint
        run: pnpm lint
      - name: Tip kontrolü
        run: pnpm typecheck
      - name: Testler
        run: pnpm test
      - name: Derleme
        run: pnpm build
